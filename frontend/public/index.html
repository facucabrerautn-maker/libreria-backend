<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librería El Faro — Catálogo, autores, géneros y ventas</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/vistas.css">
</head>
<body>
  <header>
    <p class="marca"><strong>Librería El Faro</strong></p>
  </header>
  <nav aria-label="Vistas principales">
    <ul>
      <li><a href="#/catalogo">Catálogo</a></li>
      <li><a href="#/libros">Libros</a></li>
      <li><a href="#/autores">Autores</a></li>
      <li><a href="#/generos">Géneros</a></li>
      <li><a href="#/clientes">Clientes</a></li>
      <li><a href="#/ventas">Ventas</a></li>
      <li><a href="#/historial">Historial</a></li>
    </ul>
  </nav>
  <main tabindex="-1">
    <section id="vista-catalogo" hidden>
      <h1 tabindex="-1">Catálogo</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-libros" hidden>
      <h1 tabindex="-1">Libros</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-autores" hidden>
      <h1 tabindex="-1">Autores</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-generos" hidden>
      <h1 tabindex="-1">Géneros</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-clientes" hidden>
      <h1 tabindex="-1">Clientes</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-ventas" hidden>
      <h1 tabindex="-1">Ventas</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-historial" hidden>
      <h1 tabindex="-1">Historial</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/modelo.js"></script>
  <script src="js/paginacion.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vistas/catalogo-fichas.js"></script>
  <script src="js/vistas/catalogo-buscador.js"></script>
  <script src="js/vistas/catalogo.js"></script>
  <script src="js/vistas/libros-formulario.js"></script>
  <script src="js/vistas/libros-listado.js"></script>
  <script src="js/vistas/libros.js"></script>
  <script src="js/vistas/autores-formulario.js"></script>
  <script src="js/vistas/autores-listado.js"></script>
  <script src="js/vistas/autores.js"></script>
  <script src="js/vistas/generos-formulario.js"></script>
  <script src="js/vistas/generos-listado.js"></script>
  <script src="js/vistas/generos.js"></script>
  <script src="js/vistas/clientes-formulario.js"></script>
  <script src="js/vistas/clientes-listado.js"></script>
  <script src="js/vistas/clientes.js"></script>
  <script src="js/vistas/ventas-formulario.js"></script>
  <script src="js/vistas/ventas-renglones.js"></script>
  <script src="js/vistas/ventas-detalle.js"></script>
  <script src="js/vistas/ventas.js"></script>
  <script src="js/vistas/historial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
